{% extends "base.html" %}

{% block title %}My Profile — EcoReminder{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card card-eco shadow-md">
      <div class="card-body p-4 p-md-5">
        <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
          <h3 class="font-outfit mb-0"><i class="bi bi-person-gear text-success me-2"></i>My Profile Settings</h3>
          <a href="{{ url_for('citizen_dashboard') }}" class="btn btn-sm btn-outline-secondary">Back to Dashboard</a>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ user.name }}" required />
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Email Address</label>
            <input type="email" class="form-control bg-light" value="{{ user.email }}" readonly />
            <div class="form-text">Email address cannot be modified.</div>
          </div>

          <hr class="my-4">
          <h5 class="font-outfit mb-3">Change Password</h5>

          <div class="mb-3">
            <label class="form-label fw-bold">Current Password</label>
            <input type="password" name="current_password" class="form-control" placeholder="Required only if changing password" />
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">New Password</label>
            <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current password" />
          </div>

          <button type="submit" class="btn btn-eco-primary w-100 py-2.5">
            <i class="bi bi-check-circle-fill me-2"></i> Save Profile Changes
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
