{% extends "base.html" %}

{% block title %}Report Dustbin — EcoReminder{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-9 col-lg-7">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-3">Report a Full Dustbin</h3>
          <form method="POST" enctype="multipart/form-data" novalidate>
            <div class="mb-3">
              <label class="form-label">Location</label>
              <input type="text" name="location" class="form-control" placeholder="e.g., Park Avenue 12" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Description (optional)</label>
              <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Upload photo (optional)</label>
              <input class="form-control" type="file" name="image" accept="image/*" />
            </div>
            <button class="btn btn-success w-100" type="submit">Submit report</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
