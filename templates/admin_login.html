{% extends "base.html" %}

{% block title %}Admin Portal Login — EcoReminder{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-5">
    <div class="card card-eco shadow-md border-start border-warning border-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="metric-icon pending mx-auto mb-3" style="width:60px; height:60px; font-size:1.6rem;">
            <i class="bi bi-shield-lock-fill text-warning"></i>
          </div>
          <h3 class="font-outfit text-dark mb-1">Admin Portal</h3>
          <p class="text-muted small">Sanitation network management & system analytics</p>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person-badge-fill text-muted"></i></span>
              <input type="text" name="username" class="form-control" placeholder="admin" required />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-muted"></i></span>
              <input type="password" name="password" class="form-control" placeholder="••••••••" required />
            </div>
          </div>

          <button class="btn btn-warning w-100 py-2.5 mb-3 fw-bold text-dark" type="submit">
            <i class="bi bi-shield-check me-2"></i> Admin Sign In
          </button>
        </form>

        <div class="alert alert-light border mt-4 mb-0 p-3 small text-muted">
          <div class="fw-bold text-dark mb-1"><i class="bi bi-shield-shaded text-warning me-1"></i> Default Admin Credentials:</div>
          <div>Username: <code>admin</code></div>
          <div>Password: <code>admin123</code></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
