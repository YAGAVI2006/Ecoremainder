{% extends "base.html" %}

{% block title %}Server Error (500) — EcoReminder{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-danger font-outfit">500</div>
  <h2 class="font-outfit text-dark mb-3">System Processing Error</h2>
  <p class="lead text-muted mb-4 mx-auto" style="max-width: 500px;">
    Something went wrong on our end while processing your request. Please try again in a few moments.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-eco-primary btn-lg shadow-sm">
    <i class="bi bi-arrow-counterclockwise me-2"></i> Back to Safety
  </a>
</div>
{% endblock %}
